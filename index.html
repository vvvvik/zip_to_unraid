<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Backup Status</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #0f1117;
    color: #e2e8f0;
    min-height: 100vh;
    padding: 32px 24px;
  }

  header {
    text-align: center;
    margin-bottom: 36px;
  }

  header h1 {
    font-size: 1.4rem;
    font-weight: 600;
    letter-spacing: 0.05em;
    color: #94a3b8;
    text-transform: uppercase;
  }

  #updated {
    font-size: 0.75rem;
    color: #475569;
    margin-top: 6px;
  }

  #grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 20px;
    max-width: 960px;
    margin: 0 auto;
  }

  .card {
    background: #1e2433;
    border-radius: 14px;
    padding: 24px;
    border: 1px solid #2d3748;
    position: relative;
    overflow: hidden;
  }

  .card::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    border-radius: 14px 14px 0 0;
  }

  .card.ok::before    { background: #22c55e; }
  .card.error::before { background: #ef4444; }
  .card.unknown::before { background: #64748b; }

  .card-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 18px;
  }

  .clinic-name {
    font-size: 1.4rem;
    font-weight: 700;
    letter-spacing: 0.02em;
  }

  .badge {
    font-size: 0.7rem;
    font-weight: 600;
    padding: 3px 10px;
    border-radius: 999px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  .badge.ok    { background: #14532d; color: #4ade80; }
  .badge.error { background: #450a0a; color: #f87171; }
  .badge.unknown { background: #1e293b; color: #64748b; }

  .period {
    font-size: 0.85rem;
    color: #64748b;
    margin-bottom: 18px;
  }

  .stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  .stat {
    background: #0f1117;
    border-radius: 8px;
    padding: 10px 14px;
  }

  .stat-value {
    font-size: 1.5rem;
    font-weight: 700;
    line-height: 1;
  }

  .stat-label {
    font-size: 0.7rem;
    color: #64748b;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin-top: 4px;
  }

  .stat.errors .stat-value { color: #ef4444; }
  .stat.new    .stat-value { color: #38bdf8; }

  .last-run {
    font-size: 0.75rem;
    color: #475569;
    margin-top: 16px;
    text-align: right;
  }

  .no-data {
    text-align: center;
    color: #475569;
    padding: 60px 20px;
    font-size: 0.9rem;
  }
</style>
</head>
<body>

<header>
  <h1>Backup Status</h1>
  <div id="updated"></div>
</header>

<div id="grid"></div>

<script>
const CLINICS = ["Leo", "MA"];
const STATUS_PATH = "status/";
const REFRESH_SEC = 300;

function fmt(dt) {
  if (!dt) return "—";
  const d = new Date(dt.replace(" ", "T"));
  return isNaN(d) ? dt : d.toLocaleString("uk-UA", {
    day: "2-digit", month: "2-digit", year: "numeric",
    hour: "2-digit", minute: "2-digit"
  });
}

function monthName(m) {
  const names = ["","Січень","Лютий","Березень","Квітень","Травень","Червень",
                 "Липень","Серпень","Вересень","Жовтень","Листопад","Грудень"];
  return names[parseInt(m)] || m;
}

function renderCard(data) {
  const status = data.status || "unknown";
  const period = data.year && data.month
    ? `${monthName(data.month)} ${data.year}`
    : "—";

  return `
    <div class="card ${status}">
      <div class="card-header">
        <span class="clinic-name">${data.clinic || "?"}</span>
        <span class="badge ${status}">${status === "ok" ? "OK" : status === "error" ? "Помилка" : "—"}</span>
      </div>
      <div class="period">${period}</div>
      <div class="stats">
        <div class="stat new">
          <div class="stat-value">${data.new ?? "—"}</div>
          <div class="stat-label">Нових</div>
        </div>
        <div class="stat errors">
          <div class="stat-value">${data.errors ?? "—"}</div>
          <div class="stat-label">Помилок</div>
        </div>
        <div class="stat">
          <div class="stat-value">${data.retry ?? "—"}</div>
          <div class="stat-label">Retry</div>
        </div>
        <div class="stat">
          <div class="stat-value">${data.skipped ?? "—"}</div>
          <div class="stat-label">Пропущено</div>
        </div>
      </div>
      <div class="last-run">Останній запуск: ${fmt(data.last_run)}</div>
    </div>`;
}

function renderError(name) {
  return `
    <div class="card unknown">
      <div class="card-header">
        <span class="clinic-name">${name}</span>
        <span class="badge unknown">Немає даних</span>
      </div>
      <div class="period">статус не отримано</div>
    </div>`;
}

async function loadAll() {
  const grid = document.getElementById("grid");
  grid.innerHTML = "";

  const results = await Promise.all(
    CLINICS.map(name =>
      fetch(`${STATUS_PATH}${name}.json?t=${Date.now()}`)
        .then(r => r.ok ? r.json() : null)
        .catch(() => null)
    )
  );

  results.forEach((data, i) => {
    grid.innerHTML += data ? renderCard(data) : renderError(CLINICS[i]);
  });

  document.getElementById("updated").textContent =
    "Оновлено: " + new Date().toLocaleTimeString("uk-UA");
}

loadAll();
setInterval(loadAll, REFRESH_SEC * 1000);
</script>
</body>
</html>
